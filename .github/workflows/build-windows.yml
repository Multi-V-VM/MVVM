name: C++26 codec Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codec-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec:
    name: Native GCC 16 reflection (${{ matrix.build }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build and test the portable codec
        run: |
          gcc --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DMVVM_ENABLE_DWARF_RUNTIME=OFF -DMVVM_ENABLE_LEGACY_RUNTIME=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-windows-${{ matrix.build }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: error
