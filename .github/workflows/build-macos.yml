name: C++26 codec macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codec-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec:
    name: Native GCC 16 reflection (${{ matrix.build }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - name: Install the native GCC 16 toolchain
        run: brew install gcc cmake ninja
      - name: Build and test the portable codec
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DCMAKE_C_COMPILER="$(brew --prefix)/bin/gcc-16" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix)/bin/g++-16" \
            -DMVVM_ENABLE_DWARF_RUNTIME=OFF -DMVVM_ENABLE_LEGACY_RUNTIME=OFF
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codec-macos-${{ matrix.build }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: error
