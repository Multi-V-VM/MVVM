name: DWARF Linux GCC 16

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwarf-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native AOT and DWARF (${{ matrix.build }})
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    steps:
      - name: Install GCC 16 and LLVM 20
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git gcc-16 g++-16 cmake ninja-build pkg-config \
            libdw-dev libunwind-dev libpcap-dev llvm-20-dev clang-20 lld-20 \
            zlib1g-dev libzstd-dev libedit-dev libffi-dev libpfm4-dev python3 python3-pyelftools binutils
      - uses: actions/checkout@v5
      - name: Checkout the pinned runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init lib/wasm-micro-runtime
      - name: Configure and build the runtime
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16 -DMVVM_BUILD_TCP_GATEWAY=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Validate sniffer TCP record and replay
        run: |
          python3 test/test_tcp_rr.py "$PWD/build/gateway_tcp_rr" "$PWD/gateway-results/tcp4" --interface-ready
          python3 test/test_tcp_rr.py "$PWD/build/gateway_tcp_rr" "$PWD/gateway-results/tcp6" --interface-ready --ipv6
          python3 test/test_udp_rr.py "$PWD/build/gateway_tcp_rr" "$PWD/gateway-results/udp4" --interface-ready
          python3 test/test_udp_rr.py "$PWD/build/gateway_tcp_rr" "$PWD/gateway-results/udp6" --interface-ready --ipv6
      - name: Build the patched AOT compiler
        run: |
          cmake -S lib/wasm-micro-runtime/wamr-compiler -B build-wamrc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16 \
            -DWAMR_BUILD_WITH_CUSTOM_LLVM=1 -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build build-wamrc --parallel 2
      - name: Validate real native save and restore
        run: |
          git clone https://github.com/eembc/coremark.git coremark-source
          git -C coremark-source checkout 1f483d5b8316753a742cbf5590caf5bd0a4e4777
          DWARF_OPTIMIZE=1 WAMRC="$PWD/build-wamrc/wamrc" \
            bash test/build_dwarf_benchmarks.sh "$PWD/aot-artifacts" "$PWD/coremark-source"
          python3 test/run_dwarf_benchmarks.py "$PWD/build/dwarf/mvvm_dwarf_runner" \
            "$PWD/aot-artifacts" "$PWD/results" --repeats 2
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwarf-linux-${{ matrix.build }}
          path: |
            gateway-results/**/summary.json
            results/*.json
            results/*.jsonl
            aot-artifacts/SHA256SUMS
            build/Testing/Temporary/LastTest.log
            build/dwarf/mvvm_dwarf_runner
          if-no-files-found: error
          retention-days: 14
